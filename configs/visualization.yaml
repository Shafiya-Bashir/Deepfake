visualization:
  style: "seaborn-v0_8-whitegrid"
  dpi: 300
  figure_format: "png"
  context: "paper"
  palette: "deep"

colors:
  real: "#2ca02c"
  fake: "#d62728"
  primary: "#1f77b4"
  secondary: "#ff7f0e"
  neutral: "#7f7f7f"
  highlight: "#9467bd"
  heatmap: "magma"

plots:
  confusion_matrix:
    normalize: "true"
    cmap: "Blues"
    annot_fontsize: 10
  roc_curve:
    show_chance_level: true
    line_width: 2.5
  precision_recall:
    show_baseline: true
    line_width: 2.5
  calibration:
    n_bins: 10
    strategy: "uniform"
  gradcam:
    colormap: "jet"
    alpha_overlay: 0.5
  frequency_spectrum:
    fft_cmap: "inferno"
    log_scale: true
  training_curves:
    metrics: ["loss", "accuracy", "roc_auc", "eer"]
    smooth_factor: 0.8
