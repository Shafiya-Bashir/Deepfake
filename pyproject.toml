[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake-ai"
version = "1.0.0"
description = "Enterprise-Grade Multi-Modal Deepfake Detection, Media Forensics, and Synthetic Artifact Analysis Platform"
authors = [
    { name = "Dar Rehan Rasool (M.Tech Student, Centre for Artificial Intelligence, IUST)", email = "darrehanrasool@gmail.com" },
    { name = "Dr. Riyaz Ahmed (M.Tech Student, Centre for Artificial Intelligence, IUST)" },
    { name = "Dr. M. Abdul Jawad (M.Tech Student, Centre for Artificial Intelligence, IUST)" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Topic :: Security :: Information Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "timm>=0.9.12",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
    "albumentations>=1.3.1",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.5.0",
    "tqdm>=4.66.0",
    "psutil>=5.9.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0"
]
audio = [
    "torchaudio>=2.1.0",
    "librosa>=0.10.1",
    "soundfile>=0.12.1"
]
explainability = [
    "captum>=0.7.0",
    "shap>=0.43.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
