            <text x="640.0" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94a3b8" text-anchor="middle">Reconstruction Residual Error Analysis Exposing Generative Diffusion &amp; GAN Checkerboard Artifacts</text>
            <line x1="40" y1="72" x2="1240" y2="72" stroke="#1e293b" stroke-width="1.2" />
        </g>

