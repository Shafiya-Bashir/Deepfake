            <text x="230.0" y="531" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="600" fill="#38bdf8" text-anchor="middle">[B, 3, 256, 256]</text>
            </g>
        <g class="card">
            <rect x="340" y="180" width="340" height="400" rx="10" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.6" filter="url(#shadow)" />
            <rect x="341" y="181" width="338" height="3" rx="1" fill="#818cf8" opacity="0.8" />
            <text x="510.0" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" text-anchor="middle">High-Pass Residual Extraction</text>
        
