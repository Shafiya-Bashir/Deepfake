            <rect x="41" y="221" width="258" height="3" rx="1" fill="#38bdf8" opacity="0.8" />
            <text x="170.0" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" text-anchor="middle">Query Image Input</text>
        
            <text x="170.0" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-style="italic" fill="#94a3b8" text-anchor="middle">Face / Synthetic Media</text>
            
