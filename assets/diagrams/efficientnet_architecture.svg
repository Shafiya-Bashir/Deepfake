            <rect x="771" y="221" width="258" height="3" rx="1" fill="#c084fc" opacity="0.8" />
            <text x="900.0" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" text-anchor="middle">Spatial Pooling Module</text>
        
            <text x="900.0" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-style="italic" fill="#94a3b8" text-anchor="middle">Global Feature Aggregation</text>
            
            <line x1="782" y1="274" x2="1018" y2="274" stroke="#1e293b" stroke-width="1" />
        
            <text x="784" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Adaptive Average Pooling:</text>
            
            <text x="784" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">    AdaptiveAvgPool2d((1, 1))</text>
            
            <text x="784" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Channel Dimension Reduction</text>
            
            <text x="784" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Flattening: R^[B, 128]</text>
            
            <text x="784" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Invariant to Face Pose Variations</text>
            
            <rect x="900.0" y="500" width="120.0" height="15" rx="7.5" fill="#1e293b" stroke="#c084fc" stroke-width="0.8" />
            <text x="960.0" y="511" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="600" fill="#c084fc" text-anchor="middle">f_effnet ∈ R^128</text>
            </g>
        <g class="card">
            <rect x="1070" y="240" width="210" height="260" rx="10" fill="url(#card-real-grad)" stroke="#34d399" stroke-width="1.6" filter="url(#shadow)" />
            <rect x="1071" y="241" width="208" height="3" rx="1" fill="#34d399" opacity="0.8" />
            <text x="1175.0" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" text-anchor="middle">Forensic Classifier</text>
        
