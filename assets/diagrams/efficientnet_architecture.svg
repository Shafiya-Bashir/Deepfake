            </g>
        <g class="connector">
            <line x1="730" y1="360" x2="770" y2="360" stroke="#818cf8" stroke-width="1.8" marker-end="url(#arrow-purple)"  />
        
            <text x="750.0" y="354.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#818cf8" text-anchor="middle">Features</text>
            </g>
        <g class="connector">
            <line x1="1030" y1="360" x2="1070" y2="360" stroke="#c084fc" stroke-width="1.8" marker-end="url(#arrow-purple)"  />
        
            <text x="1050.0" y="354.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#c084fc" text-anchor="middle">128-D</text>
            </g>

        <!-- Footer / Attribution -->
