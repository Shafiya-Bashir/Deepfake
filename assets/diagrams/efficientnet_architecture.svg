            <text x="40" y="788" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#64748b">DeepFake-AI Cyber-Forensics Research Suite • Dar Rehan Rasool, Dr. Riyaz Ahmed, Dr. M. Abdul Jawad (IUST CAI)</text>
