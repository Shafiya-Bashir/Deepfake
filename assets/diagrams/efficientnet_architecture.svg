            <line x1="1082" y1="294" x2="1268" y2="294" stroke="#1e293b" stroke-width="1" />
        
            <text x="1084" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Dropout(p = 0.40)</text>
            
            <text x="1084" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Linear(128 → 2)</text>
            
            <text x="1084" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Real vs Synthetic Softmax</text>
            
            <text x="1084" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Low Latency: 2.1ms</text>
            
            <rect x="1208.5" y="480" width="61.5" height="15" rx="7.5" fill="#1e293b" stroke="#34d399" stroke-width="0.8" />
            <text x="1239.25" y="491" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="600" fill="#34d399" text-anchor="middle">Softmax</text>
            </g>
        <g class="connector">
            <line x1="270" y1="360" x2="310" y2="360" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow-cyan)"  />
        
